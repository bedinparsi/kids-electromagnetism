<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="The kit: a 6-volt battery, 6 metres of red copper wire, two ceramic block magnets and a horseshoe magnet, plus household extras."><title>The kit: a 6-volt battery, 6 metres of red copper wire, two ceramic block magnets and a horseshoe magnet, plus household extras.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#0284C7"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Meet Your Science Kit</text><rect x="964" y="24" width="196" height="48" rx="24" fill="#fff"/><text x="1062" y="57" font-size="22" fill="#0284C7" font-weight="bold" text-anchor="middle" letter-spacing="1">START HERE</text><text x="40" y="140" font-size="26" fill="#1F2937" font-weight="bold">What you have:</text><rect x="40" y="155" width="262" height="315" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3"/><text x="171" y="194" font-size="24" fill="#0C4A6E" font-weight="bold" text-anchor="middle">6-volt battery</text><text x="171" y="430" font-size="21" fill="#4B5563" text-anchor="middle"><tspan x="171">Pushes electricity</tspan><tspan x="171" dy="26">round the wire</tspan></text><rect x="326" y="155" width="262" height="315" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3"/><text x="457" y="194" font-size="24" fill="#0C4A6E" font-weight="bold" text-anchor="middle">6 m copper wire</text><text x="457" y="430" font-size="21" fill="#4B5563" text-anchor="middle"><tspan x="457">Copper inside,</tspan><tspan x="457" dy="26">red plastic outside</tspan></text><rect x="612" y="155" width="262" height="315" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3"/><text x="743" y="194" font-size="24" fill="#0C4A6E" font-weight="bold" text-anchor="middle">2 block magnets</text><text x="743" y="430" font-size="21" fill="#4B5563" text-anchor="middle"><tspan x="743">Poles are on the</tspan><tspan x="743" dy="26">big flat faces</tspan></text><rect x="898" y="155" width="262" height="315" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3"/><text x="1029" y="194" font-size="24" fill="#0C4A6E" font-weight="bold" text-anchor="middle">Horseshoe magnet</text><text x="1029" y="430" font-size="21" fill="#4B5563" text-anchor="middle"><tspan x="1029">Two poles close</tspan><tspan x="1029" dy="26">together</tspan></text><polygon points="212.4,262 240,238.1 240,376.1 212.4,400" fill="#17133A"/><rect x="102" y="262" width="110.4" height="138" fill="#26215A"/><polygon points="102,262 129.6,238.1 240,238.1 212.4,262" fill="#433B8A"/><rect x="102" y="302.5" width="110.4" height="44.2" fill="#D1D5DB"/><rect x="102" y="302.5" width="110.4" height="5.5" fill="#FACC15"/><text x="157.2" y="337.4" font-size="27.6" fill="#1F2937" font-weight="bold" text-anchor="middle">6 V</text><polygon points="153.5,251.9 170.1,251.9 166.4,228 157.2,228" fill="#0B0F19"/><ellipse cx="161.8" cy="228" rx="4.6" ry="1.8" fill="#9CA3AF"/><ellipse cx="212.9" cy="249.8" rx="7.4" ry="2.8" fill="none" stroke="#E5E7EB" stroke-width="2.3"/><ellipse cx="212.9" cy="244.2" rx="7.4" ry="2.8" fill="none" stroke="#E5E7EB" stroke-width="2.3"/><ellipse cx="212.9" cy="238.7" rx="7.4" ry="2.8" fill="none" stroke="#E5E7EB" stroke-width="2.3"/><ellipse cx="212.9" cy="233.2" rx="7.4" ry="2.8" fill="none" stroke="#E5E7EB" stroke-width="2.3"/><ellipse cx="212.9" cy="227.7" rx="7.4" ry="2.8" fill="none" stroke="#E5E7EB" stroke-width="2.3"/><circle cx="139.7" cy="235.3" r="10.1" fill="#1F2937" stroke="#fff" stroke-width="1.2"/><line x1="134.7" y1="235.3" x2="144.8" y2="235.3" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><circle cx="233.1" cy="225.8" r="10.1" fill="#DC2626" stroke="#fff" stroke-width="1.2"/><line x1="228" y1="225.8" x2="238.2" y2="225.8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><line x1="233.1" y1="220.