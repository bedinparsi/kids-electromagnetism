<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Eight safety rules: work with a grown-up, 5-second rule, stop if warm, never use wall sockets, keep magnets away from phones and pacemakers, no magnet crashes, protect the compass, careful with wire ends."><title>Eight safety rules: work with a grown-up, 5-second rule, stop if warm, never use wall sockets, keep magnets away from phones and pacemakers, no magnet crashes, protect the compass, careful with wire ends.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#DC2626"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Safety Rules for Scientists</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#DC2626" font-weight="bold" text-anchor="middle" letter-spacing="1">MISSION 0</text><text x="40" y="136" font-size="23" fill="#7F1D1D" font-weight="bold">Real scientists stay safe. Learn these 8 rules before you start!</text><rect x="40" y="156" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="120" cy="226" r="52" fill="#FEE2E2"/><text x="192" y="206" font-size="26" fill="#1F2937" font-weight="bold">Team up with a grown-up</text><text x="192" y="242" font-size="20" fill="#4B5563"><tspan x="192">A grown-up helps with every</tspan><tspan x="192" dy="27">mission, from start to finish.</tspan></text><circle cx="106" cy="204" r="13" fill="#F87171"/><rect x="88" y="220" width="36" height="42" rx="13" fill="#F87171"/><circle cx="139" cy="220" r="10" fill="#FBBF24"/><rect x="126" y="233" width="26" height="29" rx="10" fill="#FBBF24"/><line x1="122" y1="240" x2="129" y2="242" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><circle cx="64" cy="180" r="17" fill="#DC2626"/><text x="64" y="181" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text><rect x="610" y="156" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="690" cy="226" r="52" fill="#FEE2E2"/><text x="762" y="206" font-size="26" fill="#1F2937" font-weight="bold">The 5-second rule</text><text x="762" y="242" font-size="20" fill="#4B5563"><tspan x="762">Connect the battery for 5 seconds</tspan><tspan x="762" dy="27">at most. Then let go and rest.</tspan></text><rect x="684.2" y="190.4" width="11.5" height="10.2" rx="2" fill="#DC2626"/><circle cx="690" cy="232" r="32" fill="#fff" stroke="#DC2626" stroke-width="4.5"/><text x="690" y="233" font-size="25" fill="#DC2626" font-weight="bold" text-anchor="middle" dominant-baseline="central">5s</text><circle cx="634" cy="180" r="17" fill="#DC2626"/><text x="634" y="181" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text><rect x="40" y="306" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="120" cy="376" r="52" fill="#FEE2E2"/><text x="192" y="356" font-size="26" fill="#1F2937" font-weight="bold">Warm? Stop!</text><text x="192" y="392" font-size="20" fill="#4B5563"><tspan x="192">If the wire or battery feels warm,</tspan><tspan x="192" dy="27">disconnect and let it cool down.</tspan></text><rect x="111" y="336" width="18" height="60" rx="9" fill="#fff" stroke="#DC2626" stroke-width="3"/><rect x="116.5" y="362" width="7" height="36" fill="#DC2626"/><circle cx="120" cy="402" r="14" fill="#DC2626"/><path d="M142,382 q 8,-8 0,-16 q -8,-8 0,-16" fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><path d="M154,382 q 8,-8 0,-16 q -8,-8 0,-16" fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><circle cx="64" cy="330" r="17" fill="#DC2626"/><text x="64" y="331" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><rect x="610" y="306" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="690" cy="376" r="52" fill="#FEE2E2"/><text x="762" y="356" font-size="26" fill="#1F2937" font-weight="bold">Never use wall sockets</text><text x="762" y="392" font-size="20" fill="#4B5563"><tspan x="762">Only use our 6-volt battery.</tspan><tspan x="762" dy="27">Mains electricity can kill.</tspan></text><rect x="665" y="351" width="50" height="50" rx="9" fill="#fff" stroke="#6B7280" stroke-width="3"/><rect x="676" y="364" width="7" height="15" fill="#374151"/><rect x="697" y="364" width="7" height="15" fill="#374151"/><circle cx="690" cy="389" r="4" fill="#374151"/><circle cx="690" cy="376" r="41" fill="none" stroke="#DC2626" stroke-width="7"/><line x1="661" y1="347" x2="719" y2="405" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><circle cx="634" cy="330" r="17" fill="#DC2626"/><text x="634" y="331" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text><rect x="40" y="456" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="120" cy="526" r="52" fill="#FEE2E2"/><text x="192" y="506" font-size="26" fill="#1F2937" font-weight="bold">Keep magnets away</text><text x="192" y="542" font-size="20" fill="#4B5563"><tspan x="192">from phones, bank cards, watches</tspan><tspan x="192" dy="27">and people with pacemakers.</tspan></text><rect x="78" y="502" width="50" height="34" rx="5" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2"/><rect x="78" y="510" width="50" height="7" fill="#1E3A8A"/><path d="M127.8,540.1 L127.8,510.2 A18.2,18.2 0 0 1 164.2,510.2 L164.2,540.1 L153.8,540.1 L153.8,510.2 A7.8,7.8 0 0 0 138.2,510.2 L138.2,540.1 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2"/><rect x="127.8" y="527.1" width="10.4" height="13" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><rect x="153.8" y="527.1" width="10.4" height="13" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><line x1="100.3" y1="556" x2="147.7" y2="556" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="butt"/><polygon points="94,556 103,561.4 103,550.6" fill="#DC2626"/><polygon points="154,556 145,550.6 145,561.4" fill="#DC2626"/><circle cx="64" cy="480" r="17" fill="#DC2626"/><text x="64" y="481" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text><rect x="610" y="456" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="690" cy="526" r="52" fill="#FEE2E2"/><text x="762" y="506" font-size="26" fill="#1F2937" font-weight="bold">No magnet crashes</text><text x="762" y="542" font-size="20" fill="#4B5563"><tspan x="762">Magnets that snap together can</tspan><tspan x="762" dy="27">chip or pinch. Slide them apart.</tspan></text><rect x="-15" y="-12" width="30" height="24" fill="#4B5563" transform="translate(664,530) rotate(-20)"/><rect x="-15" y="-12" width="30" height="24" fill="#4B5563" transform="translate(716,530) rotate(20)"/><polygon points="690,488 694,499 705,499 696,506 700,517 690,510 680,517 684,506 675,499 686,499" fill="#FACC15" stroke="#D97706" stroke-width="1.5"/><circle cx="634" cy="480" r="17" fill="#DC2626"/><text x="634" y="481" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text><rect x="40" y="606" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="120" cy="676" r="52" fill="#FEE2E2"/><text x="192" y="656" font-size="26" fill="#1F2937" font-weight="bold">Protect the compass</text><text x="192" y="692" font-size="20" fill="#4B5563"><tspan x="192">Keep magnets a hand-width away,</tspan><tspan x="192" dy="27">or the needle gets confused.</tspan></text><circle cx="100" cy="672" r="25" fill="#E2E8F0" stroke="#1F2937" stroke-width="2.5"/><circle cx="100" cy="672" r="21.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><g transform="rotate(0 100 672)"><polygon points="100,654.5 103,672 97,672" fill="#E53935"/><polygon points="97,672 103,672 100,689.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="100" cy="672" r="2.5" fill="#1F2937"/><rect x="132" y="663" width="16" height="18" fill="#1E6FD9"/><rect x="148" y="663" width="16" height="18" fill="#E53935"/><rect x="132" y="663" width="32" height="18" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><line x1="113.6" y1="709" x2="154.4" y2="709" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="butt"/><polygon points="108,709 116,713.8 116,704.2" fill="#1F2937"/><polygon points="160,709 152,704.2 152,713.8" fill="#1F2937"/><circle cx="64" cy="630" r="17" fill="#DC2626"/><text x="64" y="631" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text><rect x="610" y="606" width="550" height="140" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="3"/><circle cx="690" cy="676" r="52" fill="#FEE2E2"/><text x="762" y="656" font-size="26" fill="#1F2937" font-weight="bold">Careful with wire ends</text><text x="762" y="692" font-size="20" fill="#4B5563"><tspan x="762">A grown-up strips the ends.</tspan><tspan x="762" dy="27">Bare copper can be sharp!</tspan></text><path d="M646,696 L686,696" fill="none" stroke="#8F1239" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M646,696 L686,696" fill="none" stroke="#D61F4F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M646,696 L686,696" fill="none" stroke="#F9A8C0" stroke-width="2" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-2.2)"/><line x1="686" y1="696" x2="718" y2="696" fill="none" stroke="#7C4019" stroke-width="7" stroke-linecap="round"/><line x1="686" y1="696" x2="718" y2="696" fill="none" stroke="#C87533" stroke-width="5" stroke-linecap="round"/><g transform="translate(700,674) rotate(30) scale(0.5)"><polygon points="0,0 -9,-54 4,-50" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/><polygon points="0,0 9,-54 -4,-50" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><line x1="0" y1="0" x2="-11" y2="17" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="0" x2="11" y2="17" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/><circle cx="-16" cy="29" r="11" fill="none" stroke="#DC2626" stroke-width="5"/><circle cx="16" cy="29" r="11" fill="none" stroke="#DC2626" stroke-width="5"/><circle cx="0" cy="0" r="3" fill="#374151"/></g><circle cx="634" cy="630" r="17" fill="#DC2626"/><text x="634" y="631" font-size="19.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
