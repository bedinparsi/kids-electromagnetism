<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Magnet basics: every magnet has a north and south pole, opposite poles pull, same poles push, field lines, block and horseshoe magnets, finding poles with a compass."><title>Magnet basics: every magnet has a north and south pole, opposite poles pull, same poles push, field lines, block and horseshoe magnets, finding poles with a compass.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#7C3AED"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Magnet Basics</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#7C3AED" font-weight="bold" text-anchor="middle" letter-spacing="1">MISSION 1</text><rect x="40" y="112" width="550" height="280" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3"/><text x="64" y="148" font-size="25" fill="#1F2937" font-weight="bold">Every magnet has two poles</text><path d="M215,250 C185,216.7 445,216.7 415,250" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,225 309.5,218.4 309.5,231.6" fill="#7C3AED"/><path d="M215,250 C145,183.3 485,183.3 415,250" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,200 309.5,193.4 309.5,206.6" fill="#7C3AED"/><path d="M215,250 C105,150 525,150 415,250" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,175 309.5,168.4 309.5,181.6" fill="#7C3AED"/><path d="M215,274 C185,307.3 445,307.3 415,274" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,299 309.5,292.4 309.5,305.6" fill="#7C3AED"/><path d="M215,274 C145,340.7 485,340.7 415,274" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,324 309.5,317.4 309.5,330.6" fill="#7C3AED"/><path d="M215,274 C105,374 525,374 415,274" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.9" stroke-linecap="round"/><polygon points="320.5,349 309.5,342.4 309.5,355.6" fill="#7C3AED"/><line x1="206" y1="262" x2="119.7" y2="262" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="112,262 123,268.6 123,255.4" fill="#7C3AED"/><line x1="518" y1="262" x2="433.7" y2="262" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="426,262 437,268.6 437,255.4" fill="#7C3AED"/><rect x="215" y="242" width="100" height="40" fill="#E53935"/><rect x="315" y="242" width="100" height="40" fill="#1E6FD9"/><rect x="215" y="242" width="200" height="40" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="265" y="263" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="365" y="263" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="315" y="384" font-size="20" fill="#4B5563" text-anchor="middle">Field lines come out of N and go into S</text><rect x="610" y="112" width="550" height="280" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3"/><text x="634" y="148" font-size="25" fill="#1F2937" font-weight="bold">Pull or push?</text><rect x="650" y="172" width="75" height="40" fill="#1E6FD9"/><rect x="725" y="172" width="75" height="40" fill="#E53935"/><rect x="650" y="172" width="150" height="40" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="687.5" y="193" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="762.5" y="193" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><rect x="920" y="172" width="75" height="40" fill="#1E6FD9"/><rect x="995" y="172" width="75" height="40" fill="#E53935"/><rect x="920" y="172" width="150" height="40" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="957.5" y="193" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="1032.5" y="193" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="812" y1="192" x2="841.8" y2="192" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="butt"/><polygon points="852,192 837.4,183.2 837.4,200.8" fill="#16A34A"/><line x1="908" y1="192" x2="878.2" y2="192" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="butt"/><polygon points="868,192 882.6,200.8 882.6,183.2" fill="#16A34A"/><text x="860" y="244" font-size="21" fill="#1F2937" text-anchor="middle">N faces S: they <tspan font-weight="bold">PULL</tspan> together</text><rect x="650" y="276" width="75" height="40" fill="#1E6FD9"/><rect x="725" y="276" width="75" height="40" fill="#E53935"/><rect x="650" y="276" width="150" height="40" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="687.5" y="297" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="762.5" y="297" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><rect x="920" y="276" width="75" height="40" fill="#E53935"/><rect x="995" y="276" width="75" height="40" fill="#1E6FD9"/><rect x="920" y="276" width="150" height="40" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="957.5" y="297" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="1032.5" y="297" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><line x1="852" y1="296" x2="822.2" y2="296" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="butt"/><polygon points="812,296 826.6,304.8 826.6,287.2" fill="#DC2626"/><line x1="868" y1="296" x2="897.8" y2="296" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="butt"/><polygon points="908,296 893.4,287.2 893.4,304.8" fill="#DC2626"/><text x="860" y="348" font-size="21" fill="#1F2937" text-anchor="middle">N faces N: they <tspan font-weight="bold">PUSH</tspan> apart</text><text x="860" y="374" font-size="18" fill="#4B5563" text-anchor="middle">(S and S push apart too)</text><rect x="40" y="410" width="380" height="292" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3"/><text x="60" y="446" font-size="23" fill="#1F2937" font-weight="bold">Your block magnets</text><line x1="176" y1="528" x2="176" y2="485" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="176,478 170,488 182,488" fill="#7C3AED"/><line x1="290" y1="520" x2="290" y2="477" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="290,470 284,480 296,480" fill="#7C3AED"/><line x1="233" y1="512" x2="233" y2="473" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="233,466 227,476 239,476" fill="#7C3AED"/><polygon points="310,560 349,530.1 349,561.3 310,591.2" fill="#374151"/><rect x="115" y="560" width="195" height="31.2" fill="#4B5563"/><polygon points="115,560 154,530.1 349,530.1 310,560" fill="#6B7280"/><circle cx="232" cy="545.1" r="13.8" fill="#E53935"/><text x="232" y="546.1" font-size="17.9" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="232" y="624" font-size="19" fill="#1E6FD9" font-weight="bold" text-anchor="middle">Bottom face = S</text><text x="230" y="656" font-size="18" fill="#4B5563" text-anchor="middle"><tspan x="230">Usually N is on one big face</tspan><tspan x="230" dy="24">and S on the other. Test it!</tspan></text><rect x="440" y="410" width="320" height="292" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3"/><text x="460" y="446" font-size="23" fill="#1F2937" font-weight="bold">Horseshoe magnet</text><path d="M530,653 L530,538 A70,70 0 0 1 670,538 L670,653 L630,653 L630,538 A30,30 0 0 0 570,538 L570,653 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2"/><rect x="530" y="603" width="40" height="50" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><rect x="630" y="603" width="40" height="50" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><text x="550" y="629" font-size="22" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="650" y="629" font-size="22" fill="#1E6FD9" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><line x1="574" y1="615" x2="620.4" y2="615" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt"/><polygon points="626,615 618,610.2 618,619.8" fill="#7C3AED"/><line x1="574" y1="628" x2="620.4" y2="628" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt"/><polygon points="626,628 618,623.2 618,632.8" fill="#7C3AED"/><line x1="574" y1="641" x2="620.4" y2="641" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt"/><polygon points="626,641 618,636.2 618,645.8" fill="#7C3AED"/><text x="600" y="688" font-size="19" fill="#4B5563" text-anchor="middle">Strongest between the tips</text><rect x="780" y="410" width="380" height="292" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3"/><text x="800" y="446" font-size="23" fill="#1F2937" font-weight="bold">Find the poles</text><circle cx="875" cy="555" r="58" fill="#E2E8F0" stroke="#1F2937" stroke-width="4.1"/><circle cx="875" cy="555" r="49.9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="875" y="513.2" font-size="11.6" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="916.8" y="555" font-size="11.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">E</text><text x="875" y="596.8" font-size="11.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="833.2" y="555" font-size="11.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">W</text><g transform="rotate(90 875 555)"><polygon points="875,522.5 882,555 868,555" fill="#E53935"/><polygon points="868,555 882,555 875,587.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="875" cy="555" r="3.5" fill="#1F2937"/><rect x="1010" y="495" width="17" height="120" fill="#1E6FD9"/><rect x="1027" y="495" width="17" height="120" fill="#E53935"/><text x="1018.5" y="556" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="1035.5" y="556" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="945.6" y1="638" x2="998.4" y2="638" fill="none" stroke="#1F2937" stroke-width="2.5" stroke-linecap="butt"/><polygon points="940,638 948,642.8 948,633.2" fill="#1F2937"/><polygon points="1004,638 996,633.2 996,642.8" fill="#1F2937"/><text x="972" y="662" font-size="16" fill="#4B5563" text-anchor="middle">a hand-width</text><text x="970" y="690" font-size="19" fill="#1F2937" text-anchor="middle">The needle's red end points to S</text><rect x="40" y="716" width="1120" height="54" rx="14" fill="#EDE9FE"/><text x="600" y="750" font-size="21" fill="#1F2937" text-anchor="middle">Magnets pull on <tspan font-weight="bold">iron</tspan> and <tspan font-weight="bold">steel</tspan>. Not on copper, aluminium, plastic, wood or paper.</text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
