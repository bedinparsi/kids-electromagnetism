<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Electricity is electrons flowing through copper. It needs a complete loop. The battery is a pump; volts are push, amps are flow. Our loops are nearly short circuits, so use the 5-second rule."><title>Electricity is electrons flowing through copper. It needs a complete loop. The battery is a pump; volts are push, amps are flow. Our loops are nearly short circuits, so use the 5-second rule.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#D97706"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">What Is Electricity?</text><rect x="934" y="24" width="226" height="48" rx="24" fill="#fff"/><text x="1047" y="57" font-size="22" fill="#D97706" font-weight="bold" text-anchor="middle" letter-spacing="1">HOW IT WORKS</text><rect x="40" y="112" width="550" height="320" rx="18" fill="#FFFFFF" stroke="#FDE68A" stroke-width="3"/><text x="64" y="148" font-size="25" fill="#1F2937" font-weight="bold">Inside the wire</text><rect x="150" y="262" width="390" height="36" rx="8" fill="#C87533" stroke="#7C4019" stroke-width="2"/><rect x="70" y="238" width="160" height="84" rx="14" fill="#D61F4F" stroke="#8F1239" stroke-width="2"/><rect x="230" y="238" width="170" height="84" fill="#D61F4F" stroke="#D61F4F" stroke-width="3" fill-opacity="0.1" stroke-dasharray="8 6"/><rect x="400" y="238" width="60" height="84" fill="#D61F4F" stroke="#8F1239" stroke-width="2"/><circle cx="262" cy="280" r="12" fill="#FACC15" stroke="#A16207" stroke-width="1.8"/><circle cx="257.7" cy="277.8" r="1.7" fill="#1F2937"/><circle cx="266.3" cy="277.8" r="1.7" fill="#1F2937"/><path d="M257,282.6 Q262,287.4 267,282.6" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><circle cx="315" cy="280" r="12" fill="#FACC15" stroke="#A16207" stroke-width="1.8"/><circle cx="310.7" cy="277.8" r="1.7" fill="#1F2937"/><circle cx="319.3" cy="277.8" r="1.7" fill="#1F2937"/><path d="M310,282.6 Q315,287.4 320,282.6" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><circle cx="368" cy="280" r="12" fill="#FACC15" stroke="#A16207" stroke-width="1.8"/><circle cx="363.7" cy="277.8" r="1.7" fill="#1F2937"/><circle cx="372.3" cy="277.8" r="1.7" fill="#1F2937"/><path d="M363,282.6 Q368,287.4 373,282.6" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><circle cx="500" cy="280" r="12" fill="#FACC15" stroke="#A16207" stroke-width="1.8"/><circle cx="495.7" cy="277.8" r="1.7" fill="#1F2937"/><circle cx="504.3" cy="277.8" r="1.7" fill="#1F2937"/><path d="M495,282.6 Q500,287.4 505,282.6" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><text x="150" y="196" font-size="21" fill="#1F2937" font-weight="bold" text-anchor="middle">Plastic coat</text><text x="150" y="220" font-size="18" fill="#4B5563" text-anchor="middle">keeps electricity in</text><text x="505" y="196" font-size="21" fill="#1F2937" font-weight="bold" text-anchor="middle">Bare copper</text><text x="505" y="220" font-size="18" fill="#4B5563" text-anchor="middle">touches the battery</text><line x1="505" y1="228" x2="505" y2="256" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/><line x1="236" y1="340" x2="414.2" y2="340" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="butt"/><polygon points="424,340 410,331.6 410,348.4" fill="#F59E0B"/><text x="330" y="370" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">Copper: electrons flow easily</text><text x="315" y="412" font-size="20" fill="#4B5563" text-anchor="middle">Electricity = electrons moving through copper</text><rect x="610" y="112" width="550" height="320" rx="18" fill="#FFFFFF" stroke="#FDE68A" stroke-width="3"/><text x="634" y="148" font-size="25" fill="#1F2937" font-weight="bold">It needs a complete loop</text><path d="M728,344 L728,322 L650,322 L650,190 L850,190" fill="none" stroke="#8F1239" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M728,344 L728,322 L650,322 L650,190 L850,190" fill="none" stroke="#D61F4F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M728,344 L728,322 L650,322 L650,190 L850,190" fill="none" stroke="#F9A8C0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.5)"/><path d="M772,338 L772,322 L850,322 L850,190 L730,190" fill="none" stroke="#8F1239" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M772,338 L772,322 L850,322 L850,190 L730,190" fill="none" stroke="#D61F4F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M772,338 L772,322 L850,322 L850,190 L730,190" fill="none" stroke="#F9A8C0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.5)"/><rect x="700" y="350" width="100" height="48" rx="7" fill="#26215A"/><rect x="720" y="340" width="16" height="10" fill="#0B0F19"/><ellipse cx="772" cy="344" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><ellipse cx="772" cy="339" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><ellipse cx="772" cy="334" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="750" y="376" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">6 V</text><circle cx="650" cy="238" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="646.8" cy="236.4" r="1.3" fill="#1F2937"/><circle cx="653.2" cy="236.4" r="1.3" fill="#1F2937"/><path d="M646.2,240 Q650,243.6 653.8,240" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="650" cy="288" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="646.8" cy="286.4" r="1.3" fill="#1F2937"/><circle cx="653.2" cy="286.4" r="1.3" fill="#1F2937"/><path d="M646.2,290 Q650,293.6 653.8,290" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="698" cy="190" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="694.8" cy="188.4" r="1.3" fill="#1F2937"/><circle cx="701.2" cy="188.4" r="1.3" fill="#1F2937"/><path d="M694.2,192 Q698,195.6 701.8,192" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="802" cy="190" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="798.8" cy="188.4" r="1.3" fill="#1F2937"/><circle cx="805.2" cy="188.4" r="1.3" fill="#1F2937"/><path d="M798.2,192 Q802,195.6 805.8,192" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="850" cy="238" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="846.8" cy="236.4" r="1.3" fill="#1F2937"/><circle cx="853.2" cy="236.4" r="1.3" fill="#1F2937"/><path d="M846.2,240 Q850,243.6 853.8,240" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="850" cy="288" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="846.8" cy="286.4" r="1.3" fill="#1F2937"/><circle cx="853.2" cy="286.4" r="1.3" fill="#1F2937"/><path d="M846.2,290 Q850,293.6 853.8,290" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="688" cy="322" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="684.8" cy="320.4" r="1.3" fill="#1F2937"/><circle cx="691.2" cy="320.4" r="1.3" fill="#1F2937"/><path d="M684.2,324 Q688,327.6 691.8,324" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="812" cy="322" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="808.8" cy="320.4" r="1.3" fill="#1F2937"/><circle cx="815.2" cy="320.4" r="1.3" fill="#1F2937"/><path d="M808.2,324 Q812,327.6 815.8,324" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><line x1="624" y1="290" x2="624" y2="243.7" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="butt"/><polygon points="624,236 617.4,247 630.6,247" fill="#F59E0B"/><line x1="728" y1="166" x2="764.3" y2="166" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="butt"/><polygon points="772,166 761,159.4 761,172.6" fill="#F59E0B"/><line x1="876" y1="236" x2="876" y2="282.3" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="butt"/><polygon points="876,290 882.6,279 869.4,279" fill="#F59E0B"/><text x="750" y="422" font-size="19" fill="#16A34A" font-weight="bold" text-anchor="middle">Complete loop: it flows!</text><path d="M998,344 L998,322 L920,322 L920,190 L1000,190" fill="none" stroke="#8F1239" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M998,344 L998,322 L920,322 L920,190 L1000,190" fill="none" stroke="#D61F4F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M998,344 L998,322 L920,322 L920,190 L1000,190" fill="none" stroke="#F9A8C0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.5)"/><path d="M1042,338 L1042,322 L1120,322 L1120,190 L1040,190" fill="none" stroke="#8F1239" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M1042,338 L1042,322 L1120,322 L1120,190 L1040,190" fill="none" stroke="#D61F4F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1042,338 L1042,322 L1120,322 L1120,190 L1040,190" fill="none" stroke="#F9A8C0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.5)"/><line x1="994" y1="190" x2="1006" y2="190" fill="none" stroke="#7C4019" stroke-width="6" stroke-linecap="round"/><line x1="994" y1="190" x2="1006" y2="190" fill="none" stroke="#C87533" stroke-width="4" stroke-linecap="round"/><line x1="1034" y1="190" x2="1046" y2="190" fill="none" stroke="#7C4019" stroke-width="6" stroke-linecap="round"/><line x1="1034" y1="190" x2="1046" y2="190" fill="none" stroke="#C87533" stroke-width="4" stroke-linecap="round"/><text x="1020" y="174" font-size="18" fill="#DC2626" font-weight="bold" text-anchor="middle">gap</text><rect x="970" y="350" width="100" height="48" rx="7" fill="#26215A"/><rect x="990" y="340" width="16" height="10" fill="#0B0F19"/><ellipse cx="1042" cy="344" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><ellipse cx="1042" cy="339" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><ellipse cx="1042" cy="334" rx="7" ry="2.5" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="1020" y="376" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">6 V</text><circle cx="920" cy="238" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="916.8" cy="236.4" r="1.3" fill="#1F2937"/><circle cx="923.2" cy="236.4" r="1.3" fill="#1F2937"/><path d="M916.2,240 Q920,243.6 923.8,240" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="920" cy="288" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="916.8" cy="286.4" r="1.3" fill="#1F2937"/><circle cx="923.2" cy="286.4" r="1.3" fill="#1F2937"/><path d="M916.2,290 Q920,293.6 923.8,290" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="968" cy="190" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="964.8" cy="188.4" r="1.3" fill="#1F2937"/><circle cx="971.2" cy="188.4" r="1.3" fill="#1F2937"/><path d="M964.2,192 Q968,195.6 971.8,192" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="1072" cy="190" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="1068.8" cy="188.4" r="1.3" fill="#1F2937"/><circle cx="1075.2" cy="188.4" r="1.3" fill="#1F2937"/><path d="M1068.2,192 Q1072,195.6 1075.8,192" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="1120" cy="238" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="1116.8" cy="236.4" r="1.3" fill="#1F2937"/><circle cx="1123.2" cy="236.4" r="1.3" fill="#1F2937"/><path d="M1116.2,240 Q1120,243.6 1123.8,240" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="1120" cy="288" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="1116.8" cy="286.4" r="1.3" fill="#1F2937"/><circle cx="1123.2" cy="286.4" r="1.3" fill="#1F2937"/><path d="M1116.2,290 Q1120,293.6 1123.8,290" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="958" cy="322" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="954.8" cy="320.4" r="1.3" fill="#1F2937"/><circle cx="961.2" cy="320.4" r="1.3" fill="#1F2937"/><path d="M954.2,324 Q958,327.6 961.8,324" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><circle cx="1082" cy="322" r="9" fill="#FACC15" stroke="#A16207" stroke-width="1.3"/><circle cx="1078.8" cy="320.4" r="1.3" fill="#1F2937"/><circle cx="1085.2" cy="320.4" r="1.3" fill="#1F2937"/><path d="M1078.2,324 Q1082,327.6 1085.8,324" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><text x="1020" y="422" font-size="19" fill="#DC2626" font-weight="bold" text-anchor="middle">A gap: nothing flows!</text><rect x="40" y="450" width="360" height="318" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="3"/><text x="64" y="488" font-size="23" fill="#1F2937" font-weight="bold">The battery is a pump</text><polygon points="150.4,560 172,541.3 172,649.3 150.4,668" fill="#17133A"/><rect x="64" y="560" width="86.4" height="108" fill="#26215A"/><polygon points="64,560 85.6,541.3 172,541.3 150.4,560" fill="#433B8A"/><rect x="64" y="591.7" width="86.4" height="34.6" fill="#D1D5DB"/><rect x="64" y="591.7" width="86.4" height="4.3" fill="#FACC15"/><text x="107.2" y="619" font-size="21.6" fill="#1F2937" font-weight="bold" text-anchor="middle">6 V</text><polygon points="104.3,552.1 117.3,552.1 114.4,533.4 107.2,533.4" fill="#0B0F19"/><ellipse cx="110.8" cy="533.4" rx="3.6" ry="1.4" fill="#9CA3AF"/><ellipse cx="150.8" cy="550.4" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="150.8" cy="546.1" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="150.8" cy="541.8" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="150.8" cy="537.5" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="150.8" cy="533.1" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><circle cx="93.5" cy="539.1" r="7.9" fill="#1F2937" stroke="#fff" stroke-width="1"/><line x1="89.6" y1="539.1" x2="97.5" y2="539.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="166.6" cy="531.7" r="7.9" fill="#DC2626" stroke="#fff" stroke-width="1"/><line x1="162.6" y1="531.7" x2="170.6" y2="531.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="166.6" y1="527.7" x2="166.6" y2="535.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="200" y="548" font-size="19" fill="#1F2937"><tspan x="200">It pushes</tspan><tspan x="200" dy="25">electrons out</tspan><tspan x="200" dy="25">of its <tspan font-weight="bold">−</tspan> end,</tspan><tspan x="200" dy="25">round the loop,</tspan><tspan x="200" dy="25">and back in at</tspan><tspan x="200" dy="25">its <tspan font-weight="bold">+</tspan> end.</tspan></text><text x="64" y="722" font-size="18" fill="#92400E"><tspan x="64">Check the <tspan font-weight="bold">+</tspan> and <tspan font-weight="bold">−</tspan> marks</tspan><tspan x="64" dy="24">on the top of YOUR battery.</tspan></text><rect x="420" y="450" width="360" height="318" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="3"/><text x="444" y="488" font-size="23" fill="#1F2937" font-weight="bold">Volts and amps</text><text x="444" y="528" font-size="19" fill="#1F2937"><tspan x="444"><tspan font-weight="bold">Volts</tspan> = how hard the battery</tspan><tspan x="444" dy="26">pushes. Ours: <tspan font-weight="bold">6 volts</tspan>, safe</tspan><tspan x="444" dy="26">to touch.</tspan></text><text x="444" y="622" font-size="19" fill="#1F2937"><tspan x="444"><tspan font-weight="bold">Amps</tspan> = how much electricity</tspan><tspan x="444" dy="26">flows through the wire.</tspan></text><text x="444" y="700" font-size="19" fill="#DC2626"><tspan x="444">Wall sockets push 20 to 40 times</tspan><tspan x="444" dy="26">harder. <tspan font-weight="bold">They can kill!</tspan></tspan></text><rect x="800" y="450" width="360" height="318" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="3"/><text x="824" y="488" font-size="23" fill="#B91C1C" font-weight="bold">Warning: short circuit!</text><text x="824" y="528" font-size="19" fill="#1F2937"><tspan x="824">Our loops have almost nothing</tspan><tspan x="824" dy="26">to slow the electrons down,</tspan><tspan x="824" dy="26">so LOTS of electricity flows.</tspan><tspan x="824" dy="52">The wire and battery get warm,</tspan><tspan x="824" dy="26">and the battery runs down fast.</tspan></text><rect x="857.7" y="692.8" width="8.6" height="7.7" rx="2" fill="#DC2626"/><circle cx="862" cy="724" r="24" fill="#fff" stroke="#DC2626" stroke-width="3.4"/><text x="862" y="725" font-size="18.7" fill="#DC2626" font-weight="bold" text-anchor="middle" dominant-baseline="central">5s</text><text x="900" y="734" font-size="28" fill="#DC2626" font-weight="bold">5-second rule!</text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
