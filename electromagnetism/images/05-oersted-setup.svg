<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Mission 2: lay the wire over a compass, lined up with the needle, and touch the end to the battery for 5 seconds. The needle swings. Swap the ends and it swings the other way. Current makes magnetic circles around a wire."><title>Mission 2: lay the wire over a compass, lined up with the needle, and touch the end to the battery for 5 seconds. The needle swings. Swap the ends and it swings the other way. Current makes magnetic circles around a wire.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#0891B2"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Ørsted's Surprise</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#0891B2" font-weight="bold" text-anchor="middle" letter-spacing="1">MISSION 2</text><rect x="40" y="112" width="660" height="428" rx="18" fill="#FEF9EE" stroke="#A5F3FC" stroke-width="3"/><text x="64" y="148" font-size="25" fill="#1F2937" font-weight="bold">Set it up (seen from above)</text><line x1="662" y1="226" x2="662" y2="188.4" fill="none" stroke="#1F2937" stroke-width="4" stroke-linecap="butt"/><polygon points="662,180 654.8,192 669.2,192" fill="#1F2937"/><text x="662" y="170" font-size="22" fill="#E53935" font-weight="bold" text-anchor="middle">N</text><circle cx="400" cy="330" r="88" fill="#E2E8F0" stroke="#1F2937" stroke-width="6.2"/><circle cx="400" cy="330" r="75.7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="400" y="266.6" font-size="17.6" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="463.4" y="330" font-size="17.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">E</text><text x="400" y="393.4" font-size="17.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="336.6" y="330" font-size="17.6" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">W</text><g transform="rotate(0 400 330)"><polygon points="400,280.7 410.6,330 389.4,330" fill="#E53935"/><polygon points="389.4,330 410.6,330 400,379.3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="400" cy="330" r="5.3" fill="#1F2937"/><polygon points="170.4,422 192,403.3 192,511.3 170.4,530" fill="#17133A"/><rect x="84" y="422" width="86.4" height="108" fill="#26215A"/><polygon points="84,422 105.6,403.3 192,403.3 170.4,422" fill="#433B8A"/><rect x="84" y="453.7" width="86.4" height="34.6" fill="#D1D5DB"/><rect x="84" y="453.7" width="86.4" height="4.3" fill="#FACC15"/><text x="127.2" y="481" font-size="21.6" fill="#1F2937" font-weight="bold" text-anchor="middle">6 V</text><polygon points="124.3,414.1 137.3,414.1 134.4,395.4 127.2,395.4" fill="#0B0F19"/><ellipse cx="130.8" cy="395.4" rx="3.6" ry="1.4" fill="#9CA3AF"/><ellipse cx="170.8" cy="412.4" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="170.8" cy="408.1" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="170.8" cy="403.8" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="170.8" cy="399.5" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><ellipse cx="170.8" cy="395.1" rx="5.8" ry="2.2" fill="none" stroke="#E5E7EB" stroke-width="1.8"/><circle cx="113.5" cy="401.1" r="7.9" fill="#1F2937" stroke="#fff" stroke-width="1"/><line x1="109.6" y1="401.1" x2="117.5" y2="401.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="186.6" cy="393.7" r="7.9" fill="#DC2626" stroke="#fff" stroke-width="1"/><line x1="182.6" y1="393.7" x2="190.6" y2="393.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="186.6" y1="389.7" x2="186.6" y2="397.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M 170.8,403.8 C 196,488 400,500 400,440 L 400,200 C 400,168 112,168 112,224 L 112,330 C 112,356 116,366 121,372" fill="none" stroke="#8F1239" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170.8,403.8 C 196,488 400,500 400,440 L 400,200 C 400,168 112,168 112,224 L 112,330 C 112,356 116,366 121,372" fill="none" stroke="#D61F4F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170.8,403.8 C 196,488 400,500 400,440 L 400,200 C 400,168 112,168 112,224 L 112,330 C 112,356 116,366 121,372" fill="none" stroke="#F9A8C0" stroke-width="1.8" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-2)"/><line x1="121" y1="372" x2="127" y2="385" fill="none" stroke="#7C4019" stroke-width="7" stroke-linecap="round"/><line x1="121" y1="372" x2="127" y2="385" fill="none" stroke="#C87533" stroke-width="5" stroke-linecap="round"/><rect x="-24" y="-9" width="48" height="18" rx="2" fill="#FDE68A" stroke="#D97706" stroke-width="1.5" opacity="0.9" transform="translate(400,226) rotate(-6)"/><rect x="-24" y="-9" width="48" height="18" rx="2" fill="#FDE68A" stroke="#D97706" stroke-width="1.5" opacity="0.9" transform="translate(400,432) rotate(6)"/><text x="430" y="220" font-size="17" fill="#4B5563">tape</text><text x="132" y="300" font-size="19" fill="#0E7490" font-weight="bold"><tspan x="132">Touch this end</tspan><tspan x="132" dy="24">to the battery</tspan><tspan x="132" dy="24">for 5 seconds</tspan></text><line x1="172" y1="360" x2="140.1" y2="378.5" fill="none" stroke="#0E7490" stroke-width="3" stroke-linecap="butt"/><polygon points="134,382 145.7,382.2 139.6,371.8" fill="#0E7490"/><text x="506" y="282" font-size="21" fill="#1F2937" font-weight="bold">Compass</text><line x1="503" y1="288" x2="484" y2="300" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/><text x="506" y="334" font-size="19" fill="#1F2937"><tspan x="506">Wire lies across</tspan><tspan x="506" dy="24">the top, lined up</tspan><tspan x="506" dy="24">with the needle</tspan></text><text x="206" y="522" font-size="18" fill="#4B5563">6 V battery</text><rect x="40" y="556" width="660" height="214" rx="18" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="3"/><circle cx="150" cy="640" r="60" fill="#E2E8F0" stroke="#1F2937" stroke-width="4.2"/><circle cx="150" cy="640" r="51.6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="150" y="596.8" font-size="12" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="193.2" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">E</text><text x="150" y="683.2" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="106.8" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">W</text><g transform="rotate(0 150 640)"><polygon points="150,606.4 157.2,640 142.8,640" fill="#E53935"/><polygon points="142.8,640 157.2,640 150,673.6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="150" cy="640" r="3.6" fill="#1F2937"/><line x1="150" y1="572" x2="150" y2="708" fill="none" stroke="#D61F4F" stroke-width="9" opacity="0.6" stroke-linecap="round"/><text x="150" y="728" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="middle">Battery OFF</text><text x="150" y="751" font-size="17" fill="#4B5563" text-anchor="middle">needle points north</text><circle cx="78" cy="588" r="16" fill="#0891B2"/><text x="78" y="589" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text><circle cx="370" cy="640" r="60" fill="#E2E8F0" stroke="#1F2937" stroke-width="4.2"/><circle cx="370" cy="640" r="51.6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="370" y="596.8" font-size="12" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="413.2" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">E</text><text x="370" y="683.2" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="326.8" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">W</text><g transform="rotate(-62 370 640)"><polygon points="370,606.4 377.2,640 362.8,640" fill="#E53935"/><polygon points="362.8,640 377.2,640 370,673.6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="370" cy="640" r="3.6" fill="#1F2937"/><line x1="370" y1="572" x2="370" y2="708" fill="none" stroke="#D61F4F" stroke-width="9" opacity="0.6" stroke-linecap="round"/><polygon points="435.1,575.9 419.8,601.4 429.2,601.4 424.9,620.1 440.2,592.9 430.9,592.9" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="370" y="728" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="middle">Battery ON</text><text x="370" y="751" font-size="17" fill="#4B5563" text-anchor="middle">the needle swings!</text><circle cx="298" cy="588" r="16" fill="#0891B2"/><text x="298" y="589" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text><circle cx="590" cy="640" r="60" fill="#E2E8F0" stroke="#1F2937" stroke-width="4.2"/><circle cx="590" cy="640" r="51.6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="590" y="596.8" font-size="12" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="633.2" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">E</text><text x="590" y="683.2" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="546.8" y="640" font-size="12" fill="#9CA3AF" font-weight="bold" text-anchor="middle" dominant-baseline="central">W</text><g transform="rotate(62 590 640)"><polygon points="590,606.4 597.2,640 582.8,640" fill="#E53935"/><polygon points="582.8,640 597.2,640 590,673.6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="590" cy="640" r="3.6" fill="#1F2937"/><line x1="590" y1="572" x2="590" y2="708" fill="none" stroke="#D61F4F" stroke-width="9" opacity="0.6" stroke-linecap="round"/><polygon points="655.1,575.9 639.8,601.4 649.2,601.4 644.9,620.1 660.2,592.9 650.9,592.9" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="590" y="728" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="middle">Ends swapped</text><text x="590" y="751" font-size="17" fill="#4B5563" text-anchor="middle">it swings the other way</text><circle cx="518" cy="588" r="16" fill="#0891B2"/><text x="518" y="589" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><rect x="720" y="112" width="440" height="658" rx="18" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="3"/><text x="744" y="148" font-size="25" fill="#1F2937" font-weight="bold">Why does it happen?</text><path d="M1050,230 A110,26 0 0 0 830,230" fill="none" stroke="#0891B2" stroke-width="4" opacity="0.4" stroke-linecap="round"/><path d="M1050,310 A110,26 0 0 0 830,310" fill="none" stroke="#0891B2" stroke-width="4" opacity="0.4" stroke-linecap="round"/><path d="M1050,390 A110,26 0 0 0 830,390" fill="none" stroke="#0891B2" stroke-width="4" opacity="0.4" stroke-linecap="round"/><rect x="930" y="170" width="20" height="282" rx="10" fill="#D61F4F" stroke="#8F1239" stroke-width="2"/><line x1="940" y1="440" x2="940" y2="195.2" fill="none" stroke="#FACC15" stroke-width="6" stroke-linecap="butt"/><polygon points="940,184 930.4,200 949.6,200" fill="#FACC15"/><path d="M830,230 A110,26 0 0 0 1050,230" fill="none" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="948,256 935,248.2 935,263.8" fill="#0891B2"/><path d="M830,310 A110,26 0 0 0 1050,310" fill="none" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="948,336 935,328.2 935,343.8" fill="#0891B2"/><path d="M830,390 A110,26 0 0 0 1050,390" fill="none" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="948,416 935,408.2 935,423.8" fill="#0891B2"/><text x="940" y="478" font-size="17" fill="#4B5563" text-anchor="middle">current flowing in the wire</text><text x="744" y="512" font-size="19" fill="#1F2937"><tspan x="744">Electricity flowing in a wire makes</tspan><tspan x="744" dy="23">invisible magnetic circles around it.</tspan><tspan x="744" dy="23">The compass needle is a tiny magnet,</tspan><tspan x="744" dy="23">so the circles push it round.</tspan><tspan x="744" dy="23">Swap the ends: the circles turn the</tspan><tspan x="744" dy="23">other way, and so does the needle!</tspan></text><rect x="740" y="640" width="400" height="122" rx="14" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/><text x="758" y="667" font-size="20" fill="#0E7490" font-weight="bold">1820 · Denmark</text><text x="758" y="692" font-size="17" fill="#1F2937"><tspan x="758">Hans Christian Ørsted noticed a compass</tspan><tspan x="758" dy="21">needle move when he switched on a</tspan><tspan x="758" dy="21">current. The first clue that electricity</tspan><tspan x="758" dy="21">and magnetism are linked!</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
