<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Pushing the magnet in makes the needle kick one way, holding it still does nothing, pulling it out kicks the other way, and moving faster gives a bigger kick. Moving field lines sweep across the wire and push electrons along. Michael Faraday discovered this in 1831."><title>Pushing the magnet in makes the needle kick one way, holding it still does nothing, pulling it out kicks the other way, and moving faster gives a bigger kick. Moving field lines sweep across the wire and push electrons along. Michael Faraday discovered this in 1831.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#15803D"/><text x="40" y="63" font-size="38" fill="#fff" font-weight="bold">How Moving Magnets Make Electricity</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#15803D" font-weight="bold" text-anchor="middle" letter-spacing="1">MISSION 4</text><rect x="40" y="112" width="268" height="318" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/><text x="174" y="148" font-size="22" fill="#15803D" font-weight="bold" text-anchor="middle">Push IN</text><ellipse cx="140" cy="296" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="140" cy="296" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="140" cy="298" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="140" cy="298" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="140" cy="300" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="140" cy="300" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="140" cy="302" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="140" cy="302" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="140" cy="304" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="140" cy="304" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><polygon points="177,208 195.6,193.7 195.6,208.6 177,222.9" fill="#374151"/><rect x="84" y="208" width="93" height="14.9" fill="#4B5563"/><polygon points="84,208 102.6,193.7 195.6,193.7 177,208" fill="#6B7280"/><circle cx="139.8" cy="200.9" r="6.6" fill="#E53935"/><text x="139.8" y="201.9" font-size="8.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="140" y1="234" x2="140" y2="264.2" fill="none" stroke="#15803D" stroke-width="5" stroke-linecap="butt"/><polygon points="140,274 148.4,260 131.6,260" fill="#15803D"/><circle cx="262" cy="250" r="34" fill="#E2E8F0" stroke="#1F2937" stroke-width="2.5"/><circle cx="262" cy="250" r="29.2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><g transform="rotate(-55 262 250)"><polygon points="262,226.2 266.1,250 257.9,250" fill="#E53935"/><polygon points="257.9,250 266.1,250 262,273.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="262" cy="250" r="2.5" fill="#1F2937"/><polygon points="293.6,192.4 282.8,210.4 289.4,210.4 286.4,223.6 297.2,204.4 290.6,204.4" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="174" y="388" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">Needle kicks</text><text x="174" y="413" font-size="17" fill="#4B5563" text-anchor="middle">one way</text><rect x="323" y="112" width="268" height="318" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/><text x="457" y="148" font-size="22" fill="#15803D" font-weight="bold" text-anchor="middle">Hold STILL</text><path d="M489,296 A66,18 0 0 0 357,296" fill="none" stroke="#8F1239" stroke-width="6" opacity="0.9" stroke-linecap="round"/><path d="M489,296 A66,18 0 0 0 357,296" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M489,298 A66,18 0 0 0 357,298" fill="none" stroke="#8F1239" stroke-width="6" opacity="0.9" stroke-linecap="round"/><path d="M489,298 A66,18 0 0 0 357,298" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M489,300 A66,18 0 0 0 357,300" fill="none" stroke="#8F1239" stroke-width="6" opacity="0.9" stroke-linecap="round"/><path d="M489,300 A66,18 0 0 0 357,300" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M489,302 A66,18 0 0 0 357,302" fill="none" stroke="#8F1239" stroke-width="6" opacity="0.9" stroke-linecap="round"/><path d="M489,302 A66,18 0 0 0 357,302" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M489,304 A66,18 0 0 0 357,304" fill="none" stroke="#8F1239" stroke-width="6" opacity="0.9" stroke-linecap="round"/><path d="M489,304 A66,18 0 0 0 357,304" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><polygon points="460,298 478.6,283.7 478.6,298.6 460,312.9" fill="#374151"/><rect x="367" y="298" width="93" height="14.9" fill="#4B5563"/><polygon points="367,298 385.6,283.7 478.6,283.7 460,298" fill="#6B7280"/><circle cx="422.8" cy="290.9" r="6.6" fill="#E53935"/><text x="422.8" y="291.9" font-size="8.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><path d="M357,296 A66,18 0 0 0 489,296" fill="none" stroke="#8F1239" stroke-width="6" opacity="1" stroke-linecap="round"/><path d="M357,296 A66,18 0 0 0 489,296" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M357,298 A66,18 0 0 0 489,298" fill="none" stroke="#8F1239" stroke-width="6" opacity="1" stroke-linecap="round"/><path d="M357,298 A66,18 0 0 0 489,298" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M357,300 A66,18 0 0 0 489,300" fill="none" stroke="#8F1239" stroke-width="6" opacity="1" stroke-linecap="round"/><path d="M357,300 A66,18 0 0 0 489,300" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M357,302 A66,18 0 0 0 489,302" fill="none" stroke="#8F1239" stroke-width="6" opacity="1" stroke-linecap="round"/><path d="M357,302 A66,18 0 0 0 489,302" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><path d="M357,304 A66,18 0 0 0 489,304" fill="none" stroke="#8F1239" stroke-width="6" opacity="1" stroke-linecap="round"/><path d="M357,304 A66,18 0 0 0 489,304" fill="none" stroke="#D61F4F" stroke-width="3.5" stroke-linecap="round"/><text x="423" y="250" font-size="16" fill="#4B5563" text-anchor="middle">magnet inside</text><circle cx="545" cy="250" r="34" fill="#E2E8F0" stroke="#1F2937" stroke-width="2.5"/><circle cx="545" cy="250" r="29.2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><g transform="rotate(0 545 250)"><polygon points="545,226.2 549.1,250 540.9,250" fill="#E53935"/><polygon points="540.9,250 549.1,250 545,273.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="545" cy="250" r="2.5" fill="#1F2937"/><text x="457" y="388" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">Nothing happens!</text><text x="457" y="413" font-size="17" fill="#4B5563" text-anchor="middle">no movement, no electricity</text><rect x="606" y="112" width="268" height="318" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/><text x="740" y="148" font-size="22" fill="#15803D" font-weight="bold" text-anchor="middle">Pull OUT</text><ellipse cx="706" cy="296" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="706" cy="296" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="706" cy="298" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="706" cy="298" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="706" cy="300" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="706" cy="300" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="706" cy="302" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="706" cy="302" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="706" cy="304" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="706" cy="304" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><polygon points="743,208 761.6,193.7 761.6,208.6 743,222.9" fill="#374151"/><rect x="650" y="208" width="93" height="14.9" fill="#4B5563"/><polygon points="650,208 668.6,193.7 761.6,193.7 743,208" fill="#6B7280"/><circle cx="705.8" cy="200.9" r="6.6" fill="#E53935"/><text x="705.8" y="201.9" font-size="8.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="706" y1="274" x2="706" y2="243.8" fill="none" stroke="#15803D" stroke-width="5" stroke-linecap="butt"/><polygon points="706,234 697.6,248 714.4,248" fill="#15803D"/><circle cx="828" cy="250" r="34" fill="#E2E8F0" stroke="#1F2937" stroke-width="2.5"/><circle cx="828" cy="250" r="29.2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><g transform="rotate(55 828 250)"><polygon points="828,226.2 832.1,250 823.9,250" fill="#E53935"/><polygon points="823.9,250 832.1,250 828,273.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="828" cy="250" r="2.5" fill="#1F2937"/><polygon points="859.6,192.4 848.8,210.4 855.4,210.4 852.4,223.6 863.2,204.4 856.6,204.4" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="740" y="388" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">Kicks the OTHER way</text><text x="740" y="413" font-size="17" fill="#4B5563" text-anchor="middle">the current flows backwards</text><rect x="889" y="112" width="268" height="318" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/><text x="1023" y="148" font-size="22" fill="#15803D" font-weight="bold" text-anchor="middle">Go FASTER</text><ellipse cx="989" cy="296" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="989" cy="296" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="989" cy="298" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="989" cy="298" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="989" cy="300" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="989" cy="300" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="989" cy="302" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="989" cy="302" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="989" cy="304" rx="66" ry="18" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="989" cy="304" rx="66" ry="18" fill="none" stroke="#D61F4F" stroke-width="3.5"/><polygon points="1026,208 1044.6,193.7 1044.6,208.6 1026,222.9" fill="#374151"/><rect x="933" y="208" width="93" height="14.9" fill="#4B5563"/><polygon points="933,208 951.6,193.7 1044.6,193.7 1026,208" fill="#6B7280"/><circle cx="988.8" cy="200.9" r="6.6" fill="#E53935"/><text x="988.8" y="201.9" font-size="8.5" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="973" y1="232" x2="973" y2="265.5" fill="none" stroke="#15803D" stroke-width="6" stroke-linecap="butt"/><polygon points="973,276 982,261 964,261" fill="#15803D"/><line x1="1005" y1="232" x2="1005" y2="265.5" fill="none" stroke="#15803D" stroke-width="6" stroke-linecap="butt"/><polygon points="1005,276 1014,261 996,261" fill="#15803D"/><line x1="951" y1="168" x2="951" y2="186" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/><line x1="989" y1="162" x2="989" y2="180" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/><line x1="1027" y1="168" x2="1027" y2="186" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/><circle cx="1111" cy="250" r="34" fill="#E2E8F0" stroke="#1F2937" stroke-width="2.5"/><circle cx="1111" cy="250" r="29.2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><g transform="rotate(-85 1111 250)"><polygon points="1111,226.2 1115.1,250 1106.9,250" fill="#E53935"/><polygon points="1106.9,250 1115.1,250 1111,273.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/></g><circle cx="1111" cy="250" r="2.5" fill="#1F2937"/><polygon points="1142.6,192.4 1131.8,210.4 1138.4,210.4 1135.4,223.6 1146.2,204.4 1139.6,204.4" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="1023" y="388" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">Bigger kick!</text><text x="1023" y="413" font-size="17" fill="#4B5563" text-anchor="middle">more electricity</text><rect x="40" y="448" width="700" height="322" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/><text x="64" y="484" font-size="24" fill="#1F2937" font-weight="bold">Why does it work?</text><path d="M174,612 C108,690 98,470 174,512" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/><polygon points="120.6,570 114.3,581.2 127.5,580.8" fill="#7C3AED"/><path d="M206,612 C272,690 282,470 206,512" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/><polygon points="259.4,570 252.5,580.8 265.7,581.2" fill="#7C3AED"/><line x1="190" y1="616" x2="190" y2="683" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt"/><polygon points="190,690 196,680 184,680" fill="#7C3AED"/><rect x="170" y="512" width="40" height="50" fill="#1E6FD9"/><rect x="170" y="562" width="40" height="50" fill="#E53935"/><rect x="170" y="512" width="40" height="100" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="190" y="538" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="190" y="588" font-size="24.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><ellipse cx="190" cy="708" rx="86" ry="20" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="190" cy="708" rx="86" ry="20" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="190" cy="710.7" rx="86" ry="20" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="190" cy="710.7" rx="86" ry="20" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="190" cy="713.3" rx="86" ry="20" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="190" cy="713.3" rx="86" ry="20" fill="none" stroke="#D61F4F" stroke-width="3.5"/><ellipse cx="190" cy="716" rx="86" ry="20" fill="none" stroke="#8F1239" stroke-width="6"/><ellipse cx="190" cy="716" rx="86" ry="20" fill="none" stroke="#D61F4F" stroke-width="3.5"/><circle cx="150" cy="731" r="8" fill="#FACC15" stroke="#A16207" stroke-width="1.2"/><circle cx="147.1" cy="729.6" r="1.1" fill="#1F2937"/><circle cx="152.9" cy="729.6" r="1.1" fill="#1F2937"/><path d="M146.6,732.8 Q150,736 153.4,732.8" fill="none" stroke="#1F2937" stroke-width="1" stroke-linecap="round"/><circle cx="232" cy="731" r="8" fill="#FACC15" stroke="#A16207" stroke-width="1.2"/><circle cx="229.1" cy="729.6" r="1.1" fill="#1F2937"/><circle cx="234.9" cy="729.6" r="1.1" fill="#1F2937"/><path d="M228.6,732.8 Q232,736 235.4,732.8" fill="none" stroke="#1F2937" stroke-width="1" stroke-linecap="round"/><line x1="304" y1="520" x2="304" y2="601.5" fill="none" stroke="#15803D" stroke-width="6" stroke-linecap="butt"/><polygon points="304,612 313,597 295,597" fill="#15803D"/><text x="304" y="506" font-size="17" fill="#15803D" font-weight="bold" text-anchor="middle">moving</text><text x="350" y="522" font-size="19" fill="#1F2937"><tspan x="350">A magnet is surrounded by invisible</tspan><tspan x="350" dy="25">field lines. When the magnet moves,</tspan><tspan x="350" dy="25">its field lines sweep across the wire</tspan><tspan x="350" dy="25">and shove the electrons along:</tspan><tspan x="350" dy="25"><tspan font-weight="bold">that is an electric current!</tspan></tspan><tspan x="350" dy="50">No movement = no sweeping = no current.</tspan><tspan x="350" dy="25">In and out sweep opposite ways, so the</tspan><tspan x="350" dy="25">current flows the opposite way.</tspan></text><rect x="760" y="448" width="400" height="322" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="3"/><text x="784" y="484" font-size="22" fill="#15803D" font-weight="bold">1831 · England</text><text x="784" y="516" font-size="18" fill="#1F2937"><tspan x="784">Michael Faraday wondered: if</tspan><tspan x="784" dy="23">electricity can make magnetism,</tspan><tspan x="784" dy="23">can magnetism make electricity?</tspan><tspan x="784" dy="23">He pushed a magnet into a coil and</tspan><tspan x="784" dy="23">a meter twitched. It worked!</tspan></text><text x="784" y="650" font-size="18" fill="#1F2937"><tspan x="784"><tspan font-weight="bold">Today:</tspan> power stations spin giant</tspan><tspan x="784" dy="23">magnets inside giant coils to make</tspan><tspan x="784" dy="23">the electricity for your home.</tspan></text><line x1="1112" y1="728" x2="1112" y2="764" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><line x1="1112" y1="728" x2="1112" y2="698" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/><line x1="1112" y1="728" x2="1138" y2="743" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/><line x1="1112" y1="728" x2="1086" y2="743" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/><circle cx="1112" cy="728" r="6" fill="#64748B"/><polygon points="1064.8,719.2 1050.4,743.2 1059.2,743.2 1055.2,760.8 1069.6,735.2 1060.8,735.2" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
