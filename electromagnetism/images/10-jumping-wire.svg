<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Bonus mission: a U-shaped wire swing hangs from a pencil laid across two stacks of books. The horseshoe magnet lies on its side on a box so the bottom of the swing hangs between its tips. When the battery is touched, the swing kicks sideways. This push is what spins electric motors."><title>Bonus mission: a U-shaped wire swing hangs from a pencil laid across two stacks of books. The horseshoe magnet lies on its side on a box so the bottom of the swing hangs between its tips. When the battery is touched, the swing kicks sideways. This push is what spins electric motors.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#DB2777"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">The Jumping Wire</text><rect x="1010" y="24" width="150" height="48" rx="24" fill="#fff"/><text x="1085" y="57" font-size="22" fill="#DB2777" font-weight="bold" text-anchor="middle" letter-spacing="1">BONUS</text><rect x="40" y="112" width="600" height="448" rx="18" fill="#FFF7FB" stroke="#FBCFE8" stroke-width="3"/><text x="64" y="148" font-size="24" fill="#1F2937" font-weight="bold">Set it up (front view)</text><line x1="60" y1="520" x2="620" y2="520" fill="none" stroke="#A8A29E" stroke-width="4" stroke-linecap="round"/><rect x="70" y="440" width="130" height="80" rx="4" fill="#60A5FA" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="78" y1="504" x2="192" y2="504" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="76" y="360" width="118" height="80" rx="4" fill="#F59E0B" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="84" y1="424" x2="186" y2="424" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="72" y="280" width="126" height="80" rx="4" fill="#34D399" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="80" y1="344" x2="190" y2="344" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="480" y="440" width="130" height="80" rx="4" fill="#A78BFA" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="488" y1="504" x2="602" y2="504" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="486" y="360" width="118" height="80" rx="4" fill="#F472B6" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="494" y1="424" x2="596" y2="424" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="482" y="280" width="126" height="80" rx="4" fill="#FBBF24" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><line x1="490" y1="344" x2="600" y2="344" fill="none" stroke="#fff" stroke-width="2" opacity="0.6" stroke-linecap="round"/><rect x="270" y="470" width="140" height="50" rx="4" fill="#C4B5FD" stroke="rgba(0,0,0,0.15)" stroke-width="2"/><text x="340" y="500" font-size="16" fill="#4C1D95" text-anchor="middle">box</text><rect x="300" y="350" width="80" height="120" fill="#E11D48"/><rect x="300" y="350" width="80" height="40" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><rect x="300" y="430" width="80" height="40" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><text x="340" y="371" font-size="22" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="340" y="451" font-size="22" fill="#1E6FD9" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><g transform="translate(340,272)"><rect x="-214" y="-9" width="416" height="18" fill="#FBBF24" stroke="#B45309" stroke-width="1.5"/><line x1="-212" y1="0" x2="200" y2="0" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/><rect x="-230" y="-9" width="12" height="18" rx="3" fill="#F9A8D4" stroke="#DB2777" stroke-width="1.5"/><rect x="-220" y="-9" width="8" height="18" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/><polygon points="202,-9 230,0 202,9" fill="#FDE7C8" stroke="#B45309" stroke-width="1.5"/><polygon points="221,-3 230,0 221,3" fill="#374151"/></g><path d="M 250,284 L 250,410 L 430,410 L 430,284" fill="none" stroke="#8F1239" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 250,284 L 250,410 L 430,410 L 430,284" fill="none" stroke="#D61F4F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 250,286 C 250,250 236,230 214,206" fill="none" stroke="#8F1239" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 250,286 C 250,250 236,230 214,206" fill="none" stroke="#D61F4F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 430,286 C 430,250 444,230 466,206" fill="none" stroke="#8F1239" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 430,286 C 430,250 444,230 466,206" fill="none" stroke="#D61F4F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="214" y1="206" x2="204" y2="196" fill="none" stroke="#7C4019" stroke-width="6" stroke-linecap="round"/><line x1="214" y1="206" x2="204" y2="196" fill="none" stroke="#C87533" stroke-width="4" stroke-linecap="round"/><line x1="466" y1="206" x2="476" y2="196" fill="none" stroke="#7C4019" stroke-width="6" stroke-linecap="round"/><line x1="466" y1="206" x2="476" y2="196" fill="none" stroke="#C87533" stroke-width="4" stroke-linecap="round"/><text x="172" y="188" font-size="17" fill="#4B5563" font-weight="bold" text-anchor="middle">to battery</text><text x="510" y="188" font-size="17" fill="#4B5563" font-weight="bold" text-anchor="middle">to battery</text><text x="135" y="548" font-size="17" fill="#4B5563" text-anchor="middle">books</text><text x="545" y="548" font-size="17" fill="#4B5563" text-anchor="middle">books</text><text x="340" y="548" font-size="17" fill="#4B5563" text-anchor="middle">magnet on its side, on a box</text><circle cx="92" cy="256" r="16" fill="#DB2777"/><text x="92" y="257" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text><circle cx="228" cy="340" r="16" fill="#DB2777"/><text x="228" y="341" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text><circle cx="408" cy="340" r="16" fill="#DB2777"/><text x="408" y="341" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><circle cx="262" cy="214" r="16" fill="#DB2777"/><text x="262" y="215" font-size="18.4" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text><rect x="660" y="112" width="500" height="300" rx="18" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="3"/><text x="684" y="148" font-size="22" fill="#1F2937" font-weight="bold">Side view: watch it kick!</text><rect x="700" y="356" width="170" height="40" rx="4" fill="#C4B5FD"/><path d="M852,244 L760,244 A56,56 0 0 0 760,356 L852,356 L852,324 L760,324 A24,24 0 0 1 760,276 L852,276 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2"/><rect x="812" y="244" width="40" height="32" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><rect x="812" y="324" width="40" height="32" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><text x="832" y="261" font-size="16" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="832" y="341" font-size="16" fill="#1E6FD9" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><circle cx="832" cy="176" r="9" fill="#FBBF24" stroke="#B45309" stroke-width="2"/><path d="M 832,184 L 876,296" fill="none" stroke="#D61F4F" stroke-width="5" opacity="0.4" stroke-dasharray="8 6" stroke-linecap="round"/><circle cx="876" cy="296" r="6" fill="#D61F4F" opacity="0.4"/><path d="M 832,184 L 832,300" fill="none" stroke="#8F1239" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 832,184 L 832,300" fill="none" stroke="#D61F4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="832" cy="300" r="6" fill="#D61F4F" stroke="#8F1239" stroke-width="2"/><path d="M846,268 C854,276 862,276 872,268" fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/><polygon points="872,268 860.4,269.6 867.9,278.9" fill="#DB2777"/><text x="896" y="262" font-size="22" fill="#DB2777" font-weight="bold">kick!</text><text x="990" y="322" font-size="18" fill="#1F2937"><tspan x="990">The swing jumps</tspan><tspan x="990" dy="23">out of (or into)</tspan><tspan x="990" dy="23">the magnet.</tspan></text><rect x="660" y="428" width="500" height="342" rx="18" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="3"/><text x="684" y="464" font-size="22" fill="#1F2937" font-weight="bold">Why does it jump?</text><text x="684" y="496" font-size="18" fill="#1F2937"><tspan x="684">The current makes magnetic circles</tspan><tspan x="684" dy="24">round the wire (remember Mission 2?).</tspan><tspan x="684" dy="24">They push against the horseshoe</tspan><tspan x="684" dy="24">magnet's field and shove the wire.</tspan><tspan x="684" dy="48">Swap the battery wires, or turn the</tspan><tspan x="684" dy="24">magnet over: it jumps the other way.</tspan><tspan x="684" dy="48"><tspan font-weight="bold">This push is what spins electric</tspan></tspan><tspan x="684" dy="24"><tspan font-weight="bold">motors</tspan> in fans, drills and cars!</tspan></text><rect x="40" y="576" width="600" height="194" rx="18" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="3"/><text x="64" y="610" font-size="22" fill="#1F2937" font-weight="bold">How to build it</text><circle cx="78" cy="636" r="12" fill="#DB2777"/><text x="78" y="637" font-size="13.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text><text x="100" y="642" font-size="18" fill="#1F2937">Lay a pencil across two stacks of books.</text><circle cx="78" cy="664" r="12" fill="#DB2777"/><text x="78" y="665" font-size="13.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text><text x="100" y="670" font-size="18" fill="#1F2937">Hang a U-shaped loop of wire over it: the swing.</text><circle cx="78" cy="692" r="12" fill="#DB2777"/><text x="78" y="693" font-size="13.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><text x="100" y="698" font-size="18" fill="#1F2937"><tspan x="100">Stand the horseshoe on its side on a box, so the</tspan><tspan x="100" dy="22">bottom of the swing hangs between its tips.</tspan></text><circle cx="78" cy="742" r="12" fill="#DB2777"/><text x="78" y="743" font-size="13.8" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text><text x="100" y="748" font-size="18" fill="#1F2937">Touch the battery for 1 to 2 seconds. Watch!</text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
