<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Electricity makes magnetism (electromagnet), magnetism plus electricity makes movement (motor), and movement plus magnets makes electricity (generator). Examples: cranes, doorbells, speakers, power stations, wind turbines, bike dynamos, fans and electric cars."><title>Electricity makes magnetism (electromagnet), magnetism plus electricity makes movement (motor), and movement plus magnets makes electricity (generator). Examples: cranes, doorbells, speakers, power stations, wind turbines, bike dynamos, fans and electric cars.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#0F766E"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">The Big Idea</text><rect x="1009" y="24" width="151" height="48" rx="24" fill="#fff"/><text x="1084.5" y="57" font-size="22" fill="#0F766E" font-weight="bold" text-anchor="middle" letter-spacing="1">WRAP-UP</text><text x="40" y="138" font-size="23" fill="#115E59" font-weight="bold">Electricity, magnetism and movement can turn into each other!</text><line x1="330" y1="337" x2="209.2" y2="521" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="butt"/><polygon points="200,535 225.2,522.8 201.1,507" fill="#2563EB"/><line x1="240" y1="610" x2="503.2" y2="610" fill="none" stroke="#DB2777" stroke-width="8" stroke-linecap="butt"/><polygon points="520,610 496,595.6 496,624.4" fill="#DB2777"/><line x1="560" y1="535" x2="439.2" y2="351" fill="none" stroke="#16A34A" stroke-width="8" stroke-linecap="butt"/><polygon points="430,337 431.1,365 455.2,349.2" fill="#16A34A"/><circle cx="380" cy="262" r="80" fill="#FEF3C7" stroke="#F59E0B" stroke-width="5"/><polygon points="389,205 362,250 378.5,250 371,283 398,235 381.5,235" fill="#FACC15" stroke="#A16207" stroke-width="2" stroke-linejoin="round"/><text x="380" y="304" font-size="17" fill="#92400E" font-weight="bold" text-anchor="middle">ELECTRICITY</text><circle cx="150" cy="610" r="80" fill="#EDE9FE" stroke="#7C3AED" stroke-width="5"/><path d="M120.6,625.7 L120.6,577.4 A29.4,29.4 0 0 1 179.4,577.4 L179.4,625.7 L162.6,625.7 L162.6,577.4 A12.6,12.6 0 0 0 137.4,577.4 L137.4,625.7 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2"/><rect x="120.6" y="604.7" width="16.8" height="21" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><rect x="162.6" y="604.7" width="16.8" height="21" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/><text x="129" y="616.2" font-size="9.2" fill="#E53935" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="171" y="616.2" font-size="9.2" fill="#1E6FD9" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="150" y="652" font-size="17" fill="#5B21B6" font-weight="bold" text-anchor="middle">MAGNETISM</text><circle cx="610" cy="610" r="80" fill="#DCFCE7" stroke="#16A34A" stroke-width="5"/><ellipse cx="610" cy="575" rx="9" ry="22" fill="#22C55E" transform="rotate(0 610 595)"/><ellipse cx="610" cy="575" rx="9" ry="22" fill="#22C55E" transform="rotate(120 610 595)"/><ellipse cx="610" cy="575" rx="9" ry="22" fill="#22C55E" transform="rotate(240 610 595)"/><circle cx="610" cy="595" r="7" fill="#166534"/><path d="M576,620 C586,640 634,640 644,620" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round"/><polygon points="644,620 634.2,626.3 644.9,631.6" fill="#166534"/><text x="610" y="662" font-size="17" fill="#166534" font-weight="bold" text-anchor="middle">MOVEMENT</text><text x="64" y="380" font-size="19" fill="#1E3A8A"><tspan x="64"><tspan font-weight="bold">Electromagnet</tspan></tspan><tspan x="64" dy="24">electricity makes</tspan><tspan x="64" dy="24">magnetism</tspan><tspan x="64" dy="24">Missions 2 and 3</tspan></text><text x="522" y="380" font-size="19" fill="#14532D"><tspan x="522"><tspan font-weight="bold">Generator</tspan></tspan><tspan x="522" dy="24">moving magnets</tspan><tspan x="522" dy="24">make electricity</tspan><tspan x="522" dy="24">Mission 4</tspan></text><text x="380" y="700" font-size="19" fill="#831843" text-anchor="middle"><tspan x="380"><tspan font-weight="bold">Motor</tspan>: electricity + magnets</tspan><tspan x="380" dy="24">make movement (Bonus mission)</tspan></text><text x="380" y="468" font-size="20" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="380">A circle of</tspan><tspan x="380" dy="24">energy!</tspan></text><rect x="720" y="160" width="440" height="610" rx="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="3"/><text x="744" y="196" font-size="23" fill="#1F2937" font-weight="bold">Where you can find them</text><rect x="744" y="216" width="8" height="126" rx="4" fill="#2563EB"/><text x="764" y="236" font-size="21" fill="#2563EB" font-weight="bold">Electromagnets</text><text x="764" y="264" font-size="18" fill="#1F2937"><tspan x="764">Scrapyard cranes lifting cars</tspan><tspan x="764" dy="24">Doorbells and door locks</tspan><tspan x="764" dy="24">Speakers and headphones</tspan><tspan x="764" dy="24">MRI scanners in hospitals</tspan></text><rect x="744" y="362" width="8" height="126" rx="4" fill="#16A34A"/><text x="764" y="382" font-size="21" fill="#16A34A" font-weight="bold">Generators</text><text x="764" y="410" font-size="18" fill="#1F2937"><tspan x="764">Power stations</tspan><tspan x="764" dy="24">Wind turbines</tspan><tspan x="764" dy="24">Bike dynamo lights</tspan><tspan x="764" dy="24">Wind-up torches</tspan></text><rect x="744" y="508" width="8" height="126" rx="4" fill="#DB2777"/><text x="764" y="528" font-size="21" fill="#DB2777" font-weight="bold">Motors</text><text x="764" y="556" font-size="18" fill="#1F2937"><tspan x="764">Fans and washing machines</tspan><tspan x="764" dy="24">Electric cars and trains</tspan><tspan x="764" dy="24">Drills and toy cars</tspan><tspan x="764" dy="24">The buzz in your phone</tspan></text><rect x="744" y="666" width="392" height="90" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/><text x="760" y="694" font-size="17" fill="#1F2937"><tspan x="760"><tspan font-weight="bold">Did you know?</tspan> Most of the electricity</tspan><tspan x="760" dy="22">in your home was made by spinning</tspan><tspan x="760" dy="22">magnets and coils in a power station!</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
