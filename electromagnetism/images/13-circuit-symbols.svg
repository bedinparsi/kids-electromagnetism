<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Key to circuit symbols: wire, battery, switch, coil, coil with iron core, meter, magnet and joint."><title>Key to circuit symbols: wire, battery, switch, coil, coil with iron core, meter, magnet and joint.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#334155"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Circuit Symbols</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#334155" font-weight="bold" text-anchor="middle" letter-spacing="1">SCHEMATIC</text><text x="40" y="138" font-size="21" fill="#4B5563">Scientists draw circuits with simple symbols, so anyone in the world can read them.</text><rect x="40" y="160" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="54" y="174" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="84" y1="255" x2="264" y2="255" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="174" y="368" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Wire</text><text x="174" y="396" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="174">A line = a wire.</tspan><tspan x="174" dy="22">Ours is the red</tspan><tspan x="174" dy="22">copper wire.</tspan></text><rect x="323" y="160" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="337" y="174" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="457" y1="205" x2="457" y2="229" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="423" y1="229" x2="491" y2="229" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="441" y1="241" x2="473" y2="241" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="457" y1="243" x2="457" y2="267" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="butt"/><line x1="423" y1="269" x2="491" y2="269" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="441" y1="281" x2="473" y2="281" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="457" y1="281" x2="457" y2="305" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="509" cy="223" r="11" fill="#DC2626" stroke="#fff" stroke-width="1.3"/><line x1="503.5" y1="223" x2="514.5" y2="223" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="509" y1="217.5" x2="509" y2="228.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><circle cx="509" cy="287" r="11" fill="#1F2937" stroke="#fff" stroke-width="1.3"/><line x1="503.5" y1="287" x2="514.5" y2="287" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><text x="457" y="368" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Battery</text><text x="457" y="396" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="457">Long line = +,</tspan><tspan x="457" dy="22">short line = −.</tspan><tspan x="457" dy="22">Ours: 4 cells = 6 V.</tspan></text><rect x="606" y="160" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="620" y="174" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="660" y1="265" x2="710" y2="265" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="715" y1="262" x2="767" y2="233" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="710" cy="265" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="770" cy="265" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><line x1="770" y1="265" x2="820" y2="265" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="740" y="368" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Switch</text><text x="740" y="396" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="740">Open = OFF (a gap).</tspan><tspan x="740" dy="22">Our switch: touching</tspan><tspan x="740" dy="22">the bare end on.</tspan></text><rect x="889" y="160" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="903" y="174" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="923" y1="265" x2="953" y2="265" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path d="M953,265 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="1093" y1="265" x2="1123" y2="265" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="1023" y="368" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Coil</text><text x="1023" y="396" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="1023">Turns of wire,</tspan><tspan x="1023" dy="22">like our wire donut.</tspan></text><rect x="40" y="470" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="54" y="484" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="74" y1="585" x2="104" y2="585" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path d="M104,585 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0 a11.7,11.7 0 0 1 23.3,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="104" y1="561.3" x2="244" y2="561.3" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="104" y1="551.3" x2="244" y2="551.3" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="244" y1="585" x2="274" y2="585" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="174" y="678" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Coil + iron core</text><text x="174" y="706" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="174">The electromagnet:</tspan><tspan x="174" dy="22">a coil on a nail.</tspan></text><rect x="323" y="470" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="337" y="484" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="367" y1="565" x2="407" y2="565" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="457" cy="565" r="48" fill="#fff" stroke="#111827" stroke-width="4"/><g transform="rotate(35 457 565)"><polygon points="457,534.3 463.2,565 450.8,565" fill="#E53935"/><polygon points="450.8,565 463.2,565 457,595.7" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/></g><circle cx="457" cy="565" r="3.5" fill="#111827"/><line x1="505" y1="565" x2="547" y2="565" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="457" y="678" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Meter</text><text x="457" y="706" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="457">A galvanometer spots</tspan><tspan x="457" dy="22">electricity. Ours is</tspan><tspan x="457" dy="22">a compass + a coil.</tspan></text><rect x="606" y="470" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="620" y="484" width="240" height="160" rx="12" fill="#F8FAFC"/><rect x="670" y="547" width="70" height="36" fill="#E53935"/><rect x="740" y="547" width="70" height="36" fill="#1E6FD9"/><rect x="670" y="547" width="140" height="36" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="705" y="566" font-size="22.3" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="775" y="566" font-size="22.3" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="740" y="678" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Magnet</text><text x="740" y="706" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="740">N and S poles.</tspan><tspan x="740" dy="22">(Not an official symbol,</tspan><tspan x="740" dy="22">but very handy!)</tspan></text><rect x="889" y="470" width="268" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><rect x="903" y="484" width="240" height="160" rx="12" fill="#F8FAFC"/><line x1="943" y1="565" x2="1103" y2="565" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="1023" y1="565" x2="1023" y2="620" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="1023" cy="565" r="8" fill="#111827"/><text x="1023" y="678" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Joint</text><text x="1023" y="706" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="1023">A dot = wires joined</tspan><tspan x="1023" dy="22">together. We twist</tspan><tspan x="1023" dy="22">the bare ends.</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
