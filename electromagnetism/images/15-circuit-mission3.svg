<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Circuit diagram for Mission 3: battery, a touch switch and a coil with an iron core (the electromagnet), all in one loop."><title>Circuit diagram for Mission 3: battery, a touch switch and a coil with an iron core (the electromagnet), all in one loop.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#334155"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Circuit Diagram: Mission 3</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#334155" font-weight="bold" text-anchor="middle" letter-spacing="1">SCHEMATIC</text><rect x="40" y="112" width="760" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="64" y="150" font-size="24" fill="#1F2937" font-weight="bold">The electromagnet</text><path d="M170,385 L170,230 L300,230" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,230 L640,230 L640,640 L520,640" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,640 L170,640 L170,485" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,640 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0 a13.8,13.8 0 0 1 27.5,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="614.3" x2="520" y2="614.3" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="604.3" x2="520" y2="604.3" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="385" x2="170" y2="409" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="136" y1="409" x2="204" y2="409" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="154" y1="421" x2="186" y2="421" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="170" y1="423" x2="170" y2="447" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="butt"/><line x1="136" y1="449" x2="204" y2="449" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="154" y1="461" x2="186" y2="461" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="170" y1="461" x2="170" y2="485" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="222" cy="403" r="11" fill="#DC2626" stroke="#fff" stroke-width="1.3"/><line x1="216.5" y1="403" x2="227.5" y2="403" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="222" y1="397.5" x2="222" y2="408.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><circle cx="222" cy="467" r="11" fill="#1F2937" stroke="#fff" stroke-width="1.3"/><line x1="216.5" y1="467" x2="227.5" y2="467" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="305" y1="227" x2="357" y2="198" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="230" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="360" cy="230" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><text x="112" y="428" font-size="26" fill="#1F2937" font-weight="bold" text-anchor="end">6 V</text><text x="112" y="454" font-size="18" fill="#4B5563" text-anchor="end">battery</text><text x="330" y="184" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">switch</text><text x="330" y="270" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="330">touch the bare</tspan><tspan x="330" dy="21">end on = ON</tspan></text><text x="410" y="574" font-size="19" fill="#4B5563" font-weight="bold" text-anchor="middle">iron core: the nail</text><text x="410" y="686" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="middle">coil: your turns of wire</text><line x1="612" y1="380" x2="612" y2="472.3" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="butt"/><polygon points="612,480 618.6,469 605.4,469" fill="#F59E0B"/><text x="598" y="436" font-size="16" fill="#B45309" text-anchor="end">current</text><text x="420" y="726" font-size="18" fill="#4B5563" text-anchor="middle"><tspan x="420">More turns = more bumps = a stronger magnet.</tspan><tspan x="420" dy="24">Still almost a short circuit: 5-second rule!</tspan></text><rect x="820" y="112" width="340" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="844" y="150" font-size="22" fill="#1F2937" font-weight="bold">Symbols used</text><g transform="translate(0,205)"><g transform="translate(885,0) scale(0.62)"><line x1="0" y1="-50" x2="0" y2="-26" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-34" y1="-26" x2="34" y2="-26" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-16" y1="-14" x2="16" y2="-14" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="0" y1="-12" x2="0" y2="12" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="butt"/><line x1="-34" y1="14" x2="34" y2="14" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-16" y1="26" x2="16" y2="26" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="0" y1="26" x2="0" y2="50" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="-32" r="11" fill="#DC2626" stroke="#fff" stroke-width="1.3"/><line x1="46.5" y1="-32" x2="57.5" y2="-32" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="52" y1="-37.5" x2="52" y2="-26.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><circle cx="52" cy="32" r="11" fill="#1F2937" stroke="#fff" stroke-width="1.3"/><line x1="46.5" y1="32" x2="57.5" y2="32" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/></g></g><text x="948" y="187" font-size="20" fill="#1F2937" font-weight="bold">Battery</text><text x="948" y="211" font-size="16" fill="#4B5563"><tspan x="948">Long line = + side,</tspan><tspan x="948" dy="21">short line = − side.</tspan><tspan x="948" dy="21">Ours has 4 cells inside</tspan><tspan x="948" dy="21">(4 × 1.5 V = 6 V).</tspan></text><line x1="844" y1="282.8" x2="1136" y2="282.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,352.5)"><g transform="translate(885,0) scale(0.8)"><line x1="-60" y1="0" x2="-30" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-25" y1="-3" x2="27" y2="-32" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="-30" cy="0" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="30" cy="0" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><line x1="30" y1="0" x2="60" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></g><text x="948" y="334.5" font-size="20" fill="#1F2937" font-weight="bold">Switch</text><text x="948" y="358.5" font-size="16" fill="#4B5563"><tspan x="948">A gap you can close.</tspan><tspan x="948" dy="21">Our switch: touching</tspan><tspan x="948" dy="21">the bare wire end on.</tspan></text><line x1="844" y1="430.3" x2="1136" y2="430.3" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,500)"><g transform="translate(885,0) scale(0.9)"><path d="M-50,10 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></g><text x="948" y="482" font-size="20" fill="#1F2937" font-weight="bold">Coil</text><text x="948" y="506" font-size="16" fill="#4B5563"><tspan x="948">Bumps = turns of wire</tspan><tspan x="948" dy="21">wrapped round and</tspan><tspan x="948" dy="21">round.</tspan></text><line x1="844" y1="577.8" x2="1136" y2="577.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,647.5)"><g transform="translate(885,0) scale(0.9)"><path d="M-50,14 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-50" y1="-8" x2="50" y2="-8" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-50" y1="-18" x2="50" y2="-18" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></g><text x="948" y="629.5" font-size="20" fill="#1F2937" font-weight="bold">Iron core</text><text x="948" y="653.5" font-size="16" fill="#4B5563"><tspan x="948">Two lines next to a</tspan><tspan x="948" dy="21">coil = iron inside it.</tspan><tspan x="948" dy="21">Ours is the nail.</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
