<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Circuit diagram for Mission 4: a coil (the wire donut) with a moving magnet, joined in one loop to a meter (the compass detector). There is no battery."><title>Circuit diagram for Mission 4: a coil (the wire donut) with a moving magnet, joined in one loop to a meter (the compass detector). There is no battery.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#334155"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Circuit Diagram: Mission 4</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#334155" font-weight="bold" text-anchor="middle" letter-spacing="1">SCHEMATIC</text><rect x="40" y="112" width="760" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="64" y="150" font-size="24" fill="#1F2937" font-weight="bold">The magnet generator</text><path d="M300,280 L300,620 L365,620" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M520,280 L640,280 L640,620 L475,620" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,280 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0 a15.7,15.7 0 0 1 31.4,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="640" cy="450" r="8" fill="#111827"/><text x="656" y="456" font-size="17" fill="#4B5563">joint</text><circle cx="420" cy="620" r="55" fill="#fff" stroke="#111827" stroke-width="4"/><g transform="rotate(35 420 620)"><polygon points="420,584.8 427.2,620 412.9,620" fill="#E53935"/><polygon points="412.9,620 427.2,620 420,655.2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/></g><circle cx="420" cy="620" r="3.5" fill="#111827"/><rect x="150" y="262" width="60" height="36" fill="#1E6FD9"/><rect x="210" y="262" width="60" height="36" fill="#E53935"/><rect x="150" y="262" width="120" height="36" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="180" y="281" font-size="22.3" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="240" y="281" font-size="22.3" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><line x1="169.1" y1="232" x2="252.9" y2="232" fill="none" stroke="#15803D" stroke-width="4" stroke-linecap="butt"/><polygon points="160,232 173,239.8 173,224.2" fill="#15803D"/><polygon points="262,232 249,224.2 249,239.8" fill="#15803D"/><text x="211" y="214" font-size="17" fill="#15803D" font-weight="bold" text-anchor="middle">moves in and out</text><text x="320" y="334" font-size="19" fill="#1F2937" font-weight="bold">wire donut (coil): 10 turns</text><text x="470" y="430" font-size="21" fill="#15803D" text-anchor="middle"><tspan x="470"><tspan font-weight="bold">No battery!</tspan></tspan><tspan x="470" dy="28">The moving magnet is</tspan><tspan x="470" dy="28">the power source.</tspan></text><text x="420" y="704" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="middle">compass detector</text><text x="420" y="728" font-size="16" fill="#4B5563" text-anchor="middle">(15 turns round a compass)</text><rect x="820" y="112" width="340" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="844" y="150" font-size="22" fill="#1F2937" font-weight="bold">Symbols used</text><g transform="translate(0,205)"><g transform="translate(885,0) scale(0.9)"><path d="M-50,10 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></g><text x="948" y="187" font-size="20" fill="#1F2937" font-weight="bold">Coil</text><text x="948" y="211" font-size="16" fill="#4B5563"><tspan x="948">Bumps = turns of wire</tspan><tspan x="948" dy="21">wrapped round and</tspan><tspan x="948" dy="21">round.</tspan></text><line x1="844" y1="282.8" x2="1136" y2="282.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,352.5)"><rect x="840" y="-15" width="45" height="30" fill="#1E6FD9"/><rect x="885" y="-15" width="45" height="30" fill="#E53935"/><rect x="840" y="-15" width="90" height="30" rx="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/><text x="862.5" y="1" font-size="18.6" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><text x="907.5" y="1" font-size="18.6" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text></g><text x="948" y="334.5" font-size="20" fill="#1F2937" font-weight="bold">Magnet</text><text x="948" y="358.5" font-size="16" fill="#4B5563"><tspan x="948">N and S poles. The</tspan><tspan x="948" dy="21">arrow shows it moving.</tspan></text><line x1="844" y1="430.3" x2="1136" y2="430.3" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,500)"><g transform="translate(885,0)"><circle cx="0" cy="0" r="34" fill="#fff" stroke="#111827" stroke-width="4"/><g transform="rotate(35 0 0)"><polygon points="0,-21.8 4.4,0 -4.4,0" fill="#E53935"/><polygon points="-4.4,0 4.4,0 0,21.8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/></g><circle cx="0" cy="0" r="3.5" fill="#111827"/></g></g><text x="948" y="482" font-size="20" fill="#1F2937" font-weight="bold">Meter</text><text x="948" y="506" font-size="16" fill="#4B5563"><tspan x="948">Scientists call it a</tspan><tspan x="948" dy="21">galvanometer. Ours is</tspan><tspan x="948" dy="21">a compass + a coil.</tspan></text><line x1="844" y1="577.8" x2="1136" y2="577.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,647.5)"><line x1="840" y1="0" x2="930" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="885" y1="0" x2="885" y2="30" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="885" cy="0" r="8" fill="#111827"/></g><text x="948" y="629.5" font-size="20" fill="#1F2937" font-weight="bold">Joint</text><text x="948" y="653.5" font-size="16" fill="#4B5563"><tspan x="948">A dot = wires joined.</tspan><tspan x="948" dy="21">We twist the bare</tspan><tspan x="948" dy="21">ends together.</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
