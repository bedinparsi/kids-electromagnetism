<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Circuit diagram for the bonus mission: battery, a touch switch and a wire that runs between the north and south tips of the horseshoe magnet."><title>Circuit diagram for the bonus mission: battery, a touch switch and a wire that runs between the north and south tips of the horseshoe magnet.</title><rect x="0" y="0" width="1200" height="800" fill="#FFFDF7"/><rect x="0" y="0" width="1200" height="96" fill="#334155"/><text x="40" y="63" font-size="42" fill="#fff" font-weight="bold">Circuit Diagram: Bonus</text><rect x="979" y="24" width="181" height="48" rx="24" fill="#fff"/><text x="1069.5" y="57" font-size="22" fill="#334155" font-weight="bold" text-anchor="middle" letter-spacing="1">SCHEMATIC</text><rect x="40" y="112" width="760" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="64" y="150" font-size="24" fill="#1F2937" font-weight="bold">The jumping wire</text><path d="M170,385 L170,230 L300,230" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,230 L640,230 L640,640 L170,640 L170,485" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="590" width="120" height="36" fill="#E53935"/><rect x="360" y="654" width="120" height="36" fill="#1E6FD9"/><text x="420" y="609" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="420" y="673" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text><line x1="390" y1="628" x2="390" y2="647.4" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt"/><polygon points="390,653 394.8,645 385.2,645" fill="#7C3AED"/><line x1="450" y1="628" x2="450" y2="647.4" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt"/><polygon points="450,653 454.8,645 445.2,645" fill="#7C3AED"/><path d="M340,640 L500,640" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="574" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">horseshoe magnet tips</text><line x1="170" y1="385" x2="170" y2="409" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="136" y1="409" x2="204" y2="409" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="154" y1="421" x2="186" y2="421" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="170" y1="423" x2="170" y2="447" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="butt"/><line x1="136" y1="449" x2="204" y2="449" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="154" y1="461" x2="186" y2="461" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="170" y1="461" x2="170" y2="485" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="222" cy="403" r="11" fill="#DC2626" stroke="#fff" stroke-width="1.3"/><line x1="216.5" y1="403" x2="227.5" y2="403" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="222" y1="397.5" x2="222" y2="408.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><circle cx="222" cy="467" r="11" fill="#1F2937" stroke="#fff" stroke-width="1.3"/><line x1="216.5" y1="467" x2="227.5" y2="467" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="305" y1="227" x2="357" y2="198" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="230" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="360" cy="230" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><text x="112" y="428" font-size="26" fill="#1F2937" font-weight="bold" text-anchor="end">6 V</text><text x="112" y="454" font-size="18" fill="#4B5563" text-anchor="end">battery</text><text x="330" y="184" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="middle">switch</text><text x="330" y="270" font-size="17" fill="#4B5563" text-anchor="middle"><tspan x="330">touch the bare</tspan><tspan x="330" dy="21">end on = ON</tspan></text><line x1="460" y1="212" x2="552.3" y2="212" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="butt"/><polygon points="560,212 549,205.4 549,218.6" fill="#F59E0B"/><text x="510" y="198" font-size="16" fill="#B45309" text-anchor="middle">current</text><text x="420" y="430" font-size="21" fill="#BE185D" text-anchor="middle"><tspan x="420">Current + magnet = a push.</tspan><tspan x="420" dy="28">The wire jumps sideways!</tspan></text><text x="420" y="734" font-size="18" fill="#4B5563" text-anchor="middle">The same push spins electric motors.</text><rect x="820" y="112" width="340" height="658" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="844" y="150" font-size="22" fill="#1F2937" font-weight="bold">Symbols used</text><g transform="translate(0,205)"><g transform="translate(885,0) scale(0.62)"><line x1="0" y1="-50" x2="0" y2="-26" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-34" y1="-26" x2="34" y2="-26" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-16" y1="-14" x2="16" y2="-14" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="0" y1="-12" x2="0" y2="12" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="butt"/><line x1="-34" y1="14" x2="34" y2="14" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-16" y1="26" x2="16" y2="26" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="butt"/><line x1="0" y1="26" x2="0" y2="50" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="-32" r="11" fill="#DC2626" stroke="#fff" stroke-width="1.3"/><line x1="46.5" y1="-32" x2="57.5" y2="-32" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><line x1="52" y1="-37.5" x2="52" y2="-26.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/><circle cx="52" cy="32" r="11" fill="#1F2937" stroke="#fff" stroke-width="1.3"/><line x1="46.5" y1="32" x2="57.5" y2="32" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/></g></g><text x="948" y="187" font-size="20" fill="#1F2937" font-weight="bold">Battery</text><text x="948" y="211" font-size="16" fill="#4B5563"><tspan x="948">Long line = + side,</tspan><tspan x="948" dy="21">short line = − side.</tspan><tspan x="948" dy="21">Ours has 4 cells inside</tspan><tspan x="948" dy="21">(4 × 1.5 V = 6 V).</tspan></text><line x1="844" y1="282.8" x2="1136" y2="282.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,352.5)"><g transform="translate(885,0) scale(0.8)"><line x1="-60" y1="0" x2="-30" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><line x1="-25" y1="-3" x2="27" y2="-32" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><circle cx="-30" cy="0" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="30" cy="0" r="6" fill="#fff" stroke="#111827" stroke-width="3"/><line x1="30" y1="0" x2="60" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></g><text x="948" y="334.5" font-size="20" fill="#1F2937" font-weight="bold">Switch</text><text x="948" y="358.5" font-size="16" fill="#4B5563"><tspan x="948">A gap you can close.</tspan><tspan x="948" dy="21">Our switch: touching</tspan><tspan x="948" dy="21">the bare wire end on.</tspan></text><line x1="844" y1="430.3" x2="1136" y2="430.3" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,500)"><line x1="840" y1="0" x2="930" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g><text x="948" y="482" font-size="20" fill="#1F2937" font-weight="bold">Wire</text><text x="948" y="506" font-size="16" fill="#4B5563"><tspan x="948">A line = a wire. Ours</tspan><tspan x="948" dy="21">is the red copper wire.</tspan></text><line x1="844" y1="577.8" x2="1136" y2="577.8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><g transform="translate(0,647.5)"><rect x="850" y="-40" width="70" height="24" fill="#E53935"/><rect x="850" y="16" width="70" height="24" fill="#1E6FD9"/><line x1="836" y1="0" x2="934" y2="0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><text x="885" y="-27" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">N</text><text x="885" y="29" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text></g><text x="948" y="629.5" font-size="20" fill="#1F2937" font-weight="bold">Magnet poles</text><text x="948" y="653.5" font-size="16" fill="#4B5563"><tspan x="948">The wire runs between</tspan><tspan x="948" dy="21">the N and S tips of the</tspan><tspan x="948" dy="21">horseshoe magnet.</tspan></text><text x="1160" y="788" font-size="15" fill="#9CA3AF" text-anchor="end">Electromagnetism Adventure</text></svg>
